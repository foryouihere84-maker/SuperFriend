# ===========================================
# 多模态处理服务配置
# ===========================================

# 腾讯云 OCR 服务配置
tencent:
  ocr:
    enabled: true
    secret-id: your_secret_id
    secret-key: your_secret_key
    region: ap-beijing

  # 腾讯云 ASR 服务配置
  asr:
    enabled: true
    secret-id: your_secret_id
    secret-key: your_secret_key
    region: ap-beijing

# Stable Diffusion 图片生成配置
sd:
  api:
    enabled: false
    url: ${SD_API_URL:http://localhost:7860}
    key: ${SD_API_KEY:}
  default:
    steps: 30
    cfg-scale: 7.0
    width: 512
    height: 512
    sampler: "Euler a"
    negative-prompt: "low quality, blurry, distorted"

# ===========================================
# 文件解析配置
# ===========================================
file-parsing:
  # 支持的文件类型
  supported-types:
    image:
      - jpg
      - jpeg
      - png
      - gif
      - bmp
      - webp
    document:
      - pdf
      - docx
      - doc
      - pptx
      - ppt
      - xlsx
      - xls
    audio:
      - mp3
      - wav
      - m4a
      - flac
      - aac
    video:
      - mp4
      - avi
      - mov
      - mkv
      - webm

  # 解析限制
  limits:
    max-pdf-pages: 1000
    max-excel-rows: 10000
    max-file-size-mb: 50

# ===========================================
# 意图识别配置
# ===========================================
intent-detection:
  # 是否启用 AI 增强的意图识别
  ai-enhanced: true
  # 置信度阈值
  confidence-threshold: 0.7
