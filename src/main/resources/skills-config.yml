# Skills系统配置
skills:
  # 权重配置 - 用于技能激活分析
  activation:
    base-score-weight: 0.4
    use-when-score-weight: 0.3
    keyword-score-weight: 0.2
    context-score-weight: 0.1
    default-threshold: 0.2
  
  # 脚本执行配置
  script-execution:
    default-timeout: 60000
    max-timeout: 300000
    max-output-size: 1048576
  
  # Hook配置
  hook:
    enabled: true
    default-priority: 5
  
  # 路径配置
  paths:
    system: skills/system
    project: skills/project
